<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>
  <text x="320" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Evolucion de la latencia p99 (ms) durante la prueba</text>

  <!-- Gridlines + Y labels -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="50" y1="280" x2="620" y2="280"/>
    <line x1="50" y1="238.33" x2="620" y2="238.33"/>
    <line x1="50" y1="196.67" x2="620" y2="196.67"/>
    <line x1="50" y1="155" x2="620" y2="155"/>
    <line x1="50" y1="113.33" x2="620" y2="113.33"/>
    <line x1="50" y1="71.67" x2="620" y2="71.67"/>
    <line x1="50" y1="30" x2="620" y2="30"/>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="end">
    <text x="45" y="284">0</text>
    <text x="45" y="242">10</text>
    <text x="45" y="200">20</text>
    <text x="45" y="159">30</text>
    <text x="45" y="117">40</text>
    <text x="45" y="76">50</text>
    <text x="45" y="34">60 ms</text>
  </g>

  <!-- Axis -->
  <line x1="50" y1="280" x2="620" y2="280" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="50" y1="30" x2="50" y2="280" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Data line -->
  <polyline points="50,87.92 192.5,263.33 335,168.33 477.5,180.83 620,122.92"
            fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Points -->
  <g>
    <circle cx="50" cy="87.92" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="50" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">46.1</text>

    <circle cx="192.5" cy="263.33" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="192.5" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">4.0</text>

    <circle cx="335" cy="168.33" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="335" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">26.8</text>

    <circle cx="477.5" cy="180.83" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="477.5" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">23.8</text>

    <circle cx="620" cy="122.92" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="605" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">37.7</text>
  </g>

  <!-- X labels -->
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="50" y="298">Calentamiento</text>
    <text x="50" y="311">(t0-9s)</text>

    <text x="192.5" y="298">Calent. estable</text>
    <text x="192.5" y="311">(t9-19s)</text>

    <text x="335" y="298">Saturacion inicial</text>
    <text x="335" y="311">(t19-29s)</text>

    <text x="477.5" y="298">Saturacion media</text>
    <text x="477.5" y="311">(t29-39s)</text>

    <text x="620" y="298">Saturacion pico</text>
    <text x="620" y="311">(t39-49s, ~50 req/s)</text>
  </g>

  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#6b7280">
    Umbral SLA (p99 &lt; 200 ms) queda muy por encima de este rango: la linea nunca se acerca a el.
  </text>
</svg>
