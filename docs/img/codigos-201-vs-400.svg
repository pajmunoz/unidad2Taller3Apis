<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>
  <text x="320" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Peticiones por ventana: 201 (validas) vs 400 (rechazadas)</text>

  <!-- Gridlines + Y labels -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="50" y1="280" x2="620" y2="280"/>
    <line x1="50" y1="225" x2="620" y2="225"/>
    <line x1="50" y1="170" x2="620" y2="170"/>
    <line x1="50" y1="115" x2="620" y2="115"/>
    <line x1="50" y1="60" x2="620" y2="60"/>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="end">
    <text x="45" y="284">0</text>
    <text x="45" y="229">100</text>
    <text x="45" y="174">200</text>
    <text x="45" y="119">300</text>
    <text x="45" y="64">400</text>
  </g>

  <!-- Axis -->
  <line x1="50" y1="280" x2="620" y2="280" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="50" y1="30" x2="50" y2="280" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Bars: group width 95, bar width 30 -->
  <!-- W1: 201=50 400=45 -->
  <rect x="65" y="252.22" width="30" height="27.78" fill="#16a34a"/>
  <rect x="100" y="255" width="30" height="25" fill="#dc2626"/>
  <text x="80" y="247" text-anchor="middle" font-size="10" fill="#1f2937">50</text>
  <text x="115" y="250" text-anchor="middle" font-size="10" fill="#1f2937">45</text>

  <!-- W2: 201=55 400=50 -->
  <rect x="160" y="249.44" width="30" height="30.56" fill="#16a34a"/>
  <rect x="195" y="252.22" width="30" height="27.78" fill="#dc2626"/>
  <text x="175" y="244" text-anchor="middle" font-size="10" fill="#1f2937">55</text>
  <text x="210" y="247" text-anchor="middle" font-size="10" fill="#1f2937">50</text>

  <!-- W3: 201=210 400=192 -->
  <rect x="255" y="163.33" width="30" height="116.67" fill="#16a34a"/>
  <rect x="290" y="173.33" width="30" height="106.67" fill="#dc2626"/>
  <text x="270" y="158" text-anchor="middle" font-size="10" fill="#1f2937">210</text>
  <text x="305" y="168" text-anchor="middle" font-size="10" fill="#1f2937">192</text>

  <!-- W4: 201=332 400=321 -->
  <rect x="350" y="95.56" width="30" height="184.44" fill="#16a34a"/>
  <rect x="385" y="101.67" width="30" height="178.33" fill="#dc2626"/>
  <text x="365" y="90" text-anchor="middle" font-size="10" fill="#1f2937">332</text>
  <text x="400" y="96" text-anchor="middle" font-size="10" fill="#1f2937">321</text>

  <!-- W5: 201=428 400=441 -->
  <rect x="445" y="42.22" width="30" height="237.78" fill="#16a34a"/>
  <rect x="480" y="35" width="30" height="245" fill="#dc2626"/>
  <text x="460" y="37" text-anchor="middle" font-size="10" fill="#1f2937">428</text>
  <text x="495" y="30" text-anchor="middle" font-size="10" fill="#1f2937">441</text>

  <!-- W6 (cierre): 201=0 400=26 -->
  <rect x="540" y="280" width="30" height="0" fill="#16a34a"/>
  <rect x="575" y="265.56" width="30" height="14.44" fill="#dc2626"/>
  <text x="555" y="278" text-anchor="middle" font-size="10" fill="#1f2937">0</text>
  <text x="590" y="260" text-anchor="middle" font-size="10" fill="#1f2937">26</text>

  <!-- X labels -->
  <g font-size="10" fill="#374151" text-anchor="middle">
    <text x="97" y="297">Calent.</text>
    <text x="192" y="297">Calent. est.</text>
    <text x="287" y="297">Sat. inicial</text>
    <text x="382" y="297">Sat. media</text>
    <text x="477" y="297">Sat. pico</text>
    <text x="572" y="297">Cierre</text>
  </g>

  <!-- Legend -->
  <rect x="220" y="315" width="14" height="14" fill="#16a34a"/>
  <text x="238" y="326" font-size="12" fill="#1f2937">201 Creado (payload valido)</text>
  <rect x="420" y="315" width="14" height="14" fill="#dc2626"/>
  <text x="438" y="326" font-size="12" fill="#1f2937">400 Rechazado (payload corrupto)</text>
</svg>
